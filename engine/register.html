<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - DTECH Hub</title>
<link href="/styles.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar">
<div class="container">
<a class="navbar-brand" href="/">DTECH Hub</a>
</div>
</nav>
<div class="container">
<div class="auth-container">
<h2>Create Account</h2>
<form id="registerForm">
<div class="form-group">
<label class="form-label">Full Name</label>
<input class="form-control" required="" type="text"/>
</div>
<div class="form-group">
<label class="form-label">Email</label>
<input class="form-control" required="" type="email"/>
</div>
<div class="form-group">
<label class="form-label">Password</label>
<input class="form-control" required="" type="password"/>
</div>
<button class="btn btn-primary" type="submit">Sign Up</button>
</form>
<p>
        Already have an account? <a href="/login.html">Log in</a>
</p>
</div>
</div>
<script>
// --- js/register.js ---
const WORKER_URL = 'https://late-frost-770c.nakiaklocko57.workers.dev';

document.addEventListener('DOMContentLoaded', () => {
    const registerForm = document.getElementById('registerForm');
    if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputs = registerForm.querySelectorAll('input');
            const fullName = inputs[0].value;
            const email = inputs[1].value;
            const password = inputs[2].value;

            try {
                const res = await fetch(`${WORKER_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Account created! Please log in.');
                    window.location.href = '/login.html';
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                alert('Network error. Please try again.');
            }
        });
    }
});
</script>
</body>
</html>
