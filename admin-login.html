<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Area - DTECH Hub</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-offset);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .admin-auth-container {
      background: var(--bg);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
    }
    .admin-auth-container h2 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--primary);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .btn-block {
      width: 100%;
      margin-top: 24px;
    }
    .alert {
      padding: 12px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      display: none;
    }
    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <div class="admin-auth-container" id="loading-view">
    <h2 style="color: var(--text-light);">Loading...</h2>
  </div>

  <div class="admin-auth-container" id="setup-view" style="display: none;">
    <h2>Admin Setup</h2>
    <p style="text-align: center; color: var(--text-light); margin-bottom: 20px;">Create the master admin account. This can only be done once.</p>
    <div id="setup-alert" class="alert"></div>
    <form id="setup-form">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" class="form-control" id="setup-email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Master Password</label>
        <input type="password" class="form-control" id="setup-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Complete Setup & Login</button>
    </form>
  </div>

  <div class="admin-auth-container" id="login-view" style="display: none;">
    <h2>Admin Login</h2>
    <div id="login-alert" class="alert"></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
  </div>

  <script>
    const API_BASE = 'https://late-frost-770c.nakiaklocko57.workers.dev';

    function showAlert(view, message, type = 'error') {
      const alertEl = document.getElementById(`${view}-alert`);
      alertEl.textContent = message;
      alertEl.className = `alert alert-${type}`;
      alertEl.style.display = 'block';
    }

    async function checkSetup() {
      try {
        const res = await fetch(`${API_BASE}/api/admin/check-setup`);
        const data = await res.json();

        document.getElementById('loading-view').style.display = 'none';

        if (data.setupRequired) {
          document.getElementById('setup-view').style.display = 'block';
        } else {
          document.getElementById('login-view').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('loading-view').innerHTML = `<p style="color:red;text-align:center;">Failed to connect to API.</p>`;
      }
    }

    async function handleLogin(email, password) {
       const res = await fetch(`${API_BASE}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store admin token specifically
        localStorage.setItem('adminToken', data.token);
        window.location.href = 'admin.html';
    }

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('setup-email').value;
      const password = document.getElementById('setup-password').value;
      const btn = e.target.querySelector('button');

      try {
        btn.disabled = true;
        btn.textContent = 'Setting up...';

        const res = await fetch(`${API_BASE}/api/admin/setup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Setup failed');

        showAlert('setup', 'Setup successful! Logging in...', 'success');

        // Immediately login after setup
        await handleLogin(email, password);

      } catch (err) {
        showAlert('setup', err.message);
        btn.disabled = false;
        btn.textContent = 'Complete Setup & Login';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = e.target.querySelector('button');

      try {
        btn.disabled = true;
        btn.textContent = 'Logging in...';

        await handleLogin(email, password);

      } catch (err) {
        showAlert('login', err.message);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });

    // Init
    checkSetup();
  </script>
</body>
</html>
